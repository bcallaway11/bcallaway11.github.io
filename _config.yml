#
# This file contains configuration flags to customize your site
#

remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "default"
title: Brantly Callaway
subtitle: ""
author: "Brantly Callaway"
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      comments: true
      show_date: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      comments: false
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Keep post sources (R Markdown / Quarto), unfinished drafts, and editor
# backups out of the published site; only the rendered .md posts are built.
# Setting `exclude` replaces Jekyll's default list, so those are repeated here.
exclude:
  - "_posts/*.Rmd"
  - "_posts/*.qmd"
  - "_posts/*.R"
  - "_posts/*.bib"
  - "_drafts/*.Rmd"
  - "_drafts/*.qmd"
  - "*~"
  - _archive
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

