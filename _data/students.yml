# =============================================================================
# Title: Students
# Description: Source data for the Students page (students.md), rendered by
#              _includes/student.html. Each section is a list of students.
# Author: Brant Callaway
# Last update: 2026-10-30
# Date created: 2026-10-30
# =============================================================================
#
# Fields for each student (all optional except name):
#   name          : student's name as shown on the page
#   coauthor_name : name as written in _data/papers.yml and
#                   _data/coauthors.yml, if different from `name`
#   url           : website, used when the name isn't in coauthors.yml
#   school        : university
#   degree        : "Ph.D." or "M.A."
#   year          : year the degree was completed, or "in progress"
#   dissertation  : dissertation title (Ph.D.)
#   thesis        : thesis title (M.A.)
#   placement     : first placement
#   phd_program   : Ph.D. program an M.A. student went on to
#   current       : current position, if different from first placement
#
# Joint papers are not listed here. They are found automatically from the
# coauthor lists in _data/papers.yml, so a new paper with a student shows up
# on both the Research and Students pages.

