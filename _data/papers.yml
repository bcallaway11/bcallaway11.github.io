# =============================================================================
# Title: Research papers
# Description: Source data for the Research page (research.md), rendered by
#              _includes/paper.html. Each section is a list of papers.
# Author: Brant Callaway
# Last update: 2026-10-30
# Date created: 2026-10-28
# =============================================================================
#
# Fields for each paper (all optional except title):
#   title     : paper title
#   url       : main link for the title (journal page, arXiv, or PDF)
#   coauthors : list of names; each must match a key in _data/coauthors.yml
#               to be linked
#   venue     : journal or book (shown in italics)
#   details   : volume/issue/pages/year, shown after the venue
#   status    : for working papers, e.g. "Submitted" (shown in place of venue)
#   links     : list of {label, url} shown in the small row under the paper
#   code      : list of {label, url} for software, shown at the end of that row
#   note      : one line of extra text shown under the paper
#   topic     : key from `topics` below, for the Topic view of the Research
#               page (working papers and publications only)
#   selected  : true for the handful of papers in the Selected view

# --- Topics --------------------------------------------------------------------
